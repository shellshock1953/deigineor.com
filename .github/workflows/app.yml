name: App CI/CD

on:
  push:
    branches: [main]
    paths:
      - "v2/app/**"
  pull_request:
    paths:
      - "v2/app/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('v2/app/package.json') != ''
        with:
          node-version: 22
      - name: Install pnpm
        if: hashFiles('v2/app/package.json') != ''
        run: npm install -g pnpm@12.6.0
      - name: Install dependencies
        if: hashFiles('v2/app/package.json') != ''
        working-directory: v2/app
        run: pnpm install
      - name: Lint
        if: hashFiles('v2/app/package.json') != ''
        working-directory: v2/app
        run: pnpm run lint
      - name: Typecheck
        if: hashFiles('v2/app/package.json') != ''
        working-directory: v2/app
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: v2/app
          file: v2/app/Dockerfile
          build-args: NEXT_PUBLIC_SITE_URL=https://v2.deigineor.com
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/shellshock1953/deigineor.com/app:sha-${{ steps.vars.outputs.short_sha }}
            ghcr.io/shellshock1953/deigineor.com/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin image tag in v2/deploy/kustomization.yaml
        env:
          TAG: sha-${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i "s/^\(\s*newTag:\s*\).*/\1${TAG}/" v2/deploy/kustomization.yaml
            if git diff --quiet -- v2/deploy/kustomization.yaml; then
              echo "tags already current"; exit 0
            fi
            git commit -qam "deploy: ${TAG} [skip ci]"
            if git push --quiet origin HEAD:main; then
              echo "pinned ${TAG}"; exit 0
            fi
            echo "push raced (attempt $attempt), retrying"
          done
          echo "could not pin image tags after 3 attempts" >&2
          exit 1
