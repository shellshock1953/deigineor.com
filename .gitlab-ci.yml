stages:
- build

build:
  image: docker:20.10.16
  stage: build
  services:
    - docker:20.10.16-dind
  variables:
    IMAGE_TAG: 2xnone/deigineor.com:$CI_COMMIT_TAG
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - docker login -u 2xnone -p ${DOCKERHUB_TOKEN}
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
   - tags 
  except:
   - branches
