apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deigineor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # www.deigineor.com -> deigineor.com; www is in the cert below.
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - deigineor.com
        - www.deigineor.com
      secretName: deigineor-com-tls
  rules:
    - host: deigineor.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deigineor
                port:
                  name: http
