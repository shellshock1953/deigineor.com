apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deigineor-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - v2.deigineor.com
      secretName: v2-deigineor-com-tls
  rules:
    - host: v2.deigineor.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deigineor-web
                port:
                  name: http
