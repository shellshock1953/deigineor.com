apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deigineor-web
labels:
  - pairs:
      app.kubernetes.io/name: deigineor-web
    includeSelectors: true
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: deigineor-web-nginx
    files:
      - default.conf
