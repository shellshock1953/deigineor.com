apiVersion: apps/v1
kind: Deployment
metadata:
  name: deigineor-web
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65533
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=https://github.com/shellshock1953/deigineor.com.git
            - --ref=main
            - --root=/git
            - --link=current
            - --period=60s
            - --depth=1
          securityContext:
            runAsUser: 65533
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: git, mountPath: /git}
            - {name: git-sync-tmp, mountPath: /tmp}
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: git, mountPath: /git, readOnly: true}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: web-tmp, mountPath: /tmp}
      volumes:
        - {name: git, emptyDir: {}}
        - {name: git-sync-tmp, emptyDir: {}}
        - {name: web-tmp, emptyDir: {}}
        - name: nginx-conf
          configMap:
            name: deigineor-web-nginx
