apiVersion: apps/v1
kind: Deployment
metadata:
  name: deigineor
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001  # nextjs in v2/app/Dockerfile; USER is a name, kubelet needs the uid
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/shellshock1953/deigineor.com/app:latest
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # Next ISR writes rendered pages under /app/.next/server; shortcut: writable root, upgrade to a custom cacheHandler if hardening matters
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deigineor-postgres-app
                  key: uri
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: deigineor-app
                  key: PAYLOAD_SECRET
            - name: ADMIN_EMAIL
              value: admin@deigineor.com
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deigineor-admin
                  key: ADMIN_PASSWORD
            - name: MEDIA_DIR
              value: /data/media
            - name: NEXT_PUBLIC_SITE_URL
              value: https://v2.deigineor.com
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: deigineor-glitchtip
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_RELEASE
              value: latest
            - name: OPENPANEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: deigineor-openpanel
                  key: OPENPANEL_CLIENT_ID
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /data/media
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: deigineor-media
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
