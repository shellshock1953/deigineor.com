apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: deigineor-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: deigineor
      owner: deigineor
      encoding: UTF8
  storage:
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
