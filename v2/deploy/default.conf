server {
    listen 8080;
    server_name _;

    root /git/current/v2/site;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # answers before the first git-sync clone, so probes pass
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
