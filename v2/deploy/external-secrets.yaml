apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-app
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: deigineor-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PAYLOAD_SECRET: "{{ .PAYLOAD_SECRET }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: deigineor
---
