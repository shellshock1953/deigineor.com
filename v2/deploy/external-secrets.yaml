# PAYLOAD_SECRET is generated in-cluster once (refreshInterval 0): no 1Password item needed.
# Losing it only logs admin users out.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: deigineor-payload-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-app
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: "0"
  target:
    name: deigineor-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PAYLOAD_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: deigineor-payload-secret
---
# ADMIN_PASSWORD is generated in-cluster once (refreshInterval 0): no 1Password item needed.
# Used on first boot to create admin@deigineor.com.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: deigineor-admin-password
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: "0"
  target:
    name: deigineor-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: deigineor-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: deigineor-glitchtip
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        SENTRY_DSN: "{{ .GLITCHTIP_DSN }}"
        GLITCHTIP_DSN: "{{ .GLITCHTIP_DSN }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: deigineor-glitchtip
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-openpanel
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
