---
# Paddle (sandbox for now) API + webhook secrets and the Librarium licence signing key, from two 1Password items (onepasswordSDK store: key is <item>/<field>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deigineor-paddle
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: deigineor-paddle
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PADDLE_API_KEY
      remoteRef:
        key: deigineor paddle SANDBOX/API_KEY
    - secretKey: PADDLE_WEBHOOK_SECRET
      remoteRef:
        key: deigineor paddle SANDBOX/WEBHOOK_SECRET
    - secretKey: LICENSE_SIGNING_KEY
      remoteRef:
        key: deigineor librarium license key/password
---
