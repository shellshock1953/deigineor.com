---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deigineor
  labels:
    app: demo-deigineor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-deigineor
  template:
    metadata:
      labels:
        app: demo-deigineor
    spec:
      imagePullSecrets:
        - name: docker.dnull.systems
      containers:
      - name: demo-deigineor
        image: docker.dnull.systems/deigineor.com:demo
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-deigineor
spec:
  selector:
    app: demo-deigineor
  ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo.deigineor.dnull.systems
  annotations:
    kubernetes.io/ingress.class: public
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/tls-acme: "true"
spec:
  tls:
  - hosts:
    - "demo.deigineor.dnull.systems"
    secretName: "demo.deigineor.dnull.systems"
  rules:
  - host: "demo.deigineor.dnull.systems"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: demo-deigineor
            port:
              number: 80
